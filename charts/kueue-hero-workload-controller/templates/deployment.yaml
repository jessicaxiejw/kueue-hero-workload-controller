apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hero.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hero.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hero.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hero.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the deployment when the controller config changes.
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hero.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --config=/etc/hero/config.yaml
        - --metrics-bind-address={{ .Values.metrics.bindAddress }}
        - --metrics-secure={{ .Values.metrics.secure }}
        - --health-probe-bind-address=:8081
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        {{- range .Values.extraArgs }}
        - {{ . }}
        {{- end }}
        {{- with .Values.goMemLimit }}
        env:
        - name: GOMEMLIMIT
          value: {{ . | quote }}
        {{- end }}
        ports:
        - name: probes
          containerPort: 8081
        {{- if ne (toString .Values.metrics.bindAddress) "0" }}
        - name: metrics
          containerPort: {{ .Values.metrics.bindAddress | toString | trimPrefix ":" | int }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/hero
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "hero.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
